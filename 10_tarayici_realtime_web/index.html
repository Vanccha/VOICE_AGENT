<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sesli Ajan</title>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
      --accent: #2f6fed; --accent-text: #ffffff; --border: #e3e1dc;
      --user: #eef3fe; --bot: #f2f1ee; --danger: #c63b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416; --panel: #1d1d20; --text: #ececef; --muted: #9a9aa2;
        --accent: #5b8cff; --accent-text: #0d0d0f; --border: #2c2c31;
        --user: #1f2a44; --bot: #26262a; --danger: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    button {
      font: inherit; padding: 10px 18px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: .9rem; }
    #status.live::before {
      content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
      border-radius: 50%; background: #2fb36b; vertical-align: middle;
    }
    #log {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; min-height: 320px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .msg.user { background: var(--user); align-self: flex-end; }
    .msg.assistant { background: var(--bot); align-self: flex-start; }
    .msg.event { align-self: center; font-size: .85rem; color: var(--muted); background: none; }
    .msg.event.warn { color: var(--danger); }
    .empty { color: var(--muted); margin: auto; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>Tarayıcıda Realtime Sesli Ajan</h1>
  <p class="sub">WebRTC ve JS Agents SDK ile çalışır. İstediğin an araya girip sözünü kesebilirsin.</p>

  <div class="controls">
    <button id="connect" class="primary">Bağlan ve konuş</button>
    <button id="mute" disabled>Mikrofonu kapat</button>
    <button id="disconnect" disabled>Bitir</button>
    <span id="status">Bağlı değil</span>
  </div>

  <div id="log"><div class="empty">"Bağlan" butonuna bas ve konuşmaya başla.<br>Dene: "Bana bir hedef koyalım" ya da "İstanbul'da hava nasıl?"</div></div>
</main>

<script type="module">
  import {
    RealtimeAgent,
    RealtimeSession,
    tool,
  } from "https://cdn.jsdelivr.net/npm/@openai/agents-realtime@0.21.0/+esm";

  // --- Araçlar (tarayıcıda çalışır) ---
  const havaDurumu = tool({
    name: "hava_durumu",
    description: "Bir şehrin anlık hava durumunu getirir.",
    parameters: {
      type: "object",
      properties: { sehir: { type: "string", description: "Şehir adı" } },
      required: ["sehir"],
      additionalProperties: false,
    },
    strict: true,
    async execute({ sehir }) {
      const geo = await fetch(
        `https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name=${encodeURIComponent(sehir)}`
      ).then((r) => r.json());
      const p = geo.results?.[0];
      if (!p) return `${sehir} bulunamadı.`;
      const w = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,wind_speed_10m`
      ).then((r) => r.json());
      return `${p.name}: ${w.current.temperature_2m} derece, rüzgar ${w.current.wind_speed_10m} km/s`;
    },
  });

  const hedefler = [];
  const hedefEkle = tool({
    name: "hedef_ekle",
    description: "Kullanıcının hedef listesine yeni bir hedef ekler.",
    parameters: {
      type: "object",
      properties: { hedef: { type: "string" } },
      required: ["hedef"],
      additionalProperties: false,
    },
    strict: true,
    async execute({ hedef }) {
      hedefler.push(hedef);
      return `Eklendi. Toplam ${hedefler.length} hedef: ${hedefler.join("; ")}`;
    },
  });

  // --- Ajanlar ---
  const kocAjani = new RealtimeAgent({
    name: "YasamKocu",
    handoffDescription: "Hedef belirleme ve motivasyon konusunda yardım eden koç.",
    instructions:
      "Sen pozitif bir yaşam koçusun. Kullanıcının hedefini netleştir ve hedef_ekle ile kaydet. Kısa konuş.",
    tools: [hedefEkle],
  });

  const asistan = new RealtimeAgent({
    name: "Asistan",
    instructions:
      "Sen samimi bir Türkçe sesli asistansın. Hava durumu için aracı kullan. " +
      "Kullanıcı hedef, motivasyon ya da kişisel gelişimden bahsederse YasamKocu ajanına aktar. Kısa ve doğal konuş.",
    tools: [havaDurumu],
    handoffs: [kocAjani],
  });
  kocAjani.handoffs.push(asistan);

  // --- Arayüz ---
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let session = null;
  let muted = false;

  function setStatus(text, live = false) {
    $("status").textContent = text;
    $("status").className = live ? "live" : "";
  }

  function addEvent(text, warn = false) {
    const div = document.createElement("div");
    div.className = "msg event" + (warn ? " warn" : "");
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function renderHistory(history) {
    const events = [...log.querySelectorAll(".msg.event")];
    log.innerHTML = "";
    for (const item of history) {
      if (item.type !== "message" || item.role === "system") continue;
      const text = item.content
        .map((c) => c.transcript ?? c.text ?? "")
        .join(" ")
        .trim();
      if (!text) continue;
      const div = document.createElement("div");
      div.className = `msg ${item.role}`;
      div.textContent = text;
      log.appendChild(div);
    }
    events.slice(-3).forEach((e) => log.appendChild(e));
    log.scrollTop = log.scrollHeight;
  }

  $("connect").onclick = async () => {
    $("connect").disabled = true;
    setStatus("Bağlanıyor...");
    try {
      const { key, model } = await fetch("/token", { method: "POST" }).then((r) => {
        if (!r.ok) throw new Error("Sunucu anahtar üretemedi. .env dosyasındaki API anahtarını kontrol et.");
        return r.json();
      });

      session = new RealtimeSession(asistan, {
        model,
        config: {
          audio: {
            input: { transcription: { model: "gpt-4o-mini-transcribe", language: "tr" } },
            output: { voice: "marin" },
          },
        },
      });

      session.on("history_updated", renderHistory);
      session.on("agent_handoff", (_ctx, from, to) => addEvent(`Aktarım: ${from.name} → ${to.name}`));
      session.on("agent_tool_start", (_ctx, _agent, t) => addEvent(`Araç çalışıyor: ${t.name}`));
      session.on("audio_interrupted", () => addEvent("Sözü kesildi"));
      session.on("error", (e) => addEvent(`Hata: ${e?.error?.message ?? e?.error ?? e}`, true));

      await session.connect({ apiKey: key }); // Tarayıcıda varsayılan olarak WebRTC kullanır
      setStatus("Bağlı, dinliyorum", true);
      $("mute").disabled = false;
      $("disconnect").disabled = false;
    } catch (err) {
      setStatus("Bağlanamadı");
      addEvent(String(err.message ?? err), true);
      $("connect").disabled = false;
    }
  };

  $("mute").onclick = () => {
    muted = !muted;
    session?.mute(muted);
    $("mute").textContent = muted ? "Mikrofonu aç" : "Mikrofonu kapat";
    setStatus(muted ? "Mikrofon kapalı" : "Bağlı, dinliyorum", !muted);
  };

  $("disconnect").onclick = () => {
    session?.close();
    session = null;
    muted = false;
    $("mute").textContent = "Mikrofonu kapat";
    $("connect").disabled = false;
    $("mute").disabled = true;
    $("disconnect").disabled = true;
    setStatus("Bağlı değil");
  };
</script>
</body>
</html>
